name: Generate Snow Ensemble Forecast

on:
  push:
    branches:
      - claude/snow-ensemble-github-actions-015sZZdvXEYTnKE7oVxsv1o1
    paths:
      - 'src/**'
      - 'generate_forecast.py'
      - 'requirements.txt'
      - '.github/workflows/generate-forecast.yml'
  schedule:
    # Run daily at 12:00 UTC (after model runs are typically available)
    - cron: '0 12 * * *'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      region:
        description: 'Region to generate forecast for'
        required: false
        default: 'intermountain_west'
        type: choice
        options:
          - western_us
          - intermountain_west

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate forecast
        env:
          REGION: ${{ github.event.inputs.region || 'intermountain_west' }}
        continue-on-error: false
        run: |
          echo "Starting forecast generation for region: $REGION"
          python generate_forecast.py \
            --region $REGION \
            --max-hours 240 \
            --output-dir docs \
            --email [email protected] 2>&1 | tee forecast.log
          echo "Forecast generation completed"

      - name: Generate point forecasts for interactive map
        continue-on-error: true
        run: |
          echo "Generating point forecasts for popular ski resorts..."
          mkdir -p docs/forecasts

          # Big Sky, MT
          python generate_point_forecast.py --lat 45.28 --lon -111.40 \
            --output docs/forecasts/big_sky_mt.json || echo "Big Sky forecast failed"

          # Alta, UT
          python generate_point_forecast.py --lat 40.59 --lon -111.64 \
            --output docs/forecasts/alta_ut.json || echo "Alta forecast failed"

          # Bridger Bowl, MT
          python generate_point_forecast.py --lat 45.82 --lon -110.90 \
            --output docs/forecasts/bridger_bowl_mt.json || echo "Bridger Bowl forecast failed"

          # Jackson Hole, WY
          python generate_point_forecast.py --lat 43.59 --lon -110.83 \
            --output docs/forecasts/jackson_hole_wy.json || echo "Jackson Hole forecast failed"

          # Grand Targhee, WY
          python generate_point_forecast.py --lat 43.79 --lon -111.10 \
            --output docs/forecasts/grand_targhee_wy.json || echo "Grand Targhee forecast failed"

          echo "Point forecasts generation completed"

      - name: Commit and push forecast updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff --staged --quiet || git commit -m "Update snow forecast $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -u origin claude/snow-ensemble-github-actions-015sZZdvXEYTnKE7oVxsv1o1 || echo "No changes to push"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-maps
          path: |
            docs/*.png
            docs/metadata.json
            forecast.log
          retention-days: 30

  deploy-pages:
    needs: generate-forecast
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/snow-ensemble-github-actions-015sZZdvXEYTnKE7oVxsv1o1

      - name: Pull latest changes
        run: git pull origin claude/snow-ensemble-github-actions-015sZZdvXEYTnKE7oVxsv1o1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output Pages URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
